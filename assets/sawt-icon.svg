</defs>
<rect x="1" y="1" width="94" height="94" rx="23" fill="url(#bg)" stroke="#4a596b" stroke-width="1.5"/>
<path d="M75 51 C81 42 75 32 66 33 C56 34 51 40 52 47 C53 57 66 61 76 53 C70 59 63 61 54 61 L25 61 C20 61 19 67 23 72 C30 83 48 81 56 71" fill="none" stroke="url(#ink)" stroke-width="7.8" stroke-linecap="round" stroke-linejoin="round"/>
