<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
<title id="title">SAWT logo — inspired by Arabic Ṣād</title>
<desc id="desc">An abstracted loop and bowl from the dotless Arabic letter Ṣād, with an independent SAWT vowel accent.</desc>
<defs>
